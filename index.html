<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qui主页 - ADOFAI 冰与火之舞</title>
    <style>
        :root {
            --ice-1: #a8d8ff;
            --ice-2: #4fc3f7;
            --ice-3: #0288d1;
            --ice-4: #0a3d6b;
            --fire-1: #ffe0b2;
            --fire-2: #ff9800;
            --fire-3: #ff5722;
            --fire-4: #b71c1c;
            --bg-dark: #0d0d1a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-primary: #f0f4ff;
            --text-secondary: #b0c4de;
            --text-muted: #7a8fa6;
            --shadow-glow-ice: 0 0 40px rgba(79, 195, 247, 0.35), 0 0 80px rgba(2, 136, 209, 0.2);
            --shadow-glow-fire: 0 0 40px rgba(255, 87, 34, 0.4), 0 0 80px rgba(183, 28, 28, 0.25);
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.55;
            animation: orbFloat 14s ease-in-out infinite alternate;
        }

        .orb-ice {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle at 30% 30%, #4fc3f7, #0a3d6b 70%);
            top: -15%;
            left: -10%;
            animation-delay: 0s;
            animation-duration: 16s;
        }

        .orb-fire {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle at 60% 40%, #ff9800, #b71c1c 70%);
            bottom: -20%;
            right: -10%;
            animation-delay: -4s;
            animation-duration: 18s;
        }

        .orb-deep {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle at 50% 50%, #1a237e, #000000 80%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.35;
            animation-delay: -8s;
            animation-duration: 20s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(40px, -30px) scale(1.05);
            }
            66% {
                transform: translate(-25px, 20px) scale(0.97);
            }
            100% {
                transform: translate(15px, -10px) scale(1.03);
            }
        }

        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particleRise linear infinite;
            opacity: 0;
        }

        .particle-ice {
            width: 4px;
            height: 4px;
            background: #a8d8ff;
            box-shadow: 0 0 8px #4fc3f7, 0 0 16px rgba(79, 195, 247, 0.5);
            animation-duration: 8s;
        }

        .particle-fire {
            width: 3px;
            height: 3px;
            background: #ffcc80;
            box-shadow: 0 0 8px #ff9800, 0 0 16px rgba(255, 87, 34, 0.5);
            animation-duration: 7s;
            animation-delay: -3s;
        }

        @keyframes particleRise {
            0% {
                opacity: 0;
                transform: translateY(20vh) scale(0.5);
            }
            15% {
                opacity: 0.8;
            }
            85% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1.2);
            }
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 680px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: var(--transition-smooth);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, var(--ice-2) 20%, #ffffff 50%, var(--fire-2) 80%, transparent 100%);
            opacity: 0.8;
            animation: gradientShift 4s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 0%;
                opacity: 0.7;
            }
            50% {
                background-position: 100% 0%;
                opacity: 1;
            }
        }

        .glass-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at top left, rgba(79, 195, 247, 0.06), transparent 60%),
                radial-gradient(ellipse at bottom right, rgba(255, 87, 34, 0.06), transparent 60%);
            pointer-events: none;
            border-radius: 28px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 36px;
            position: relative;
            z-index: 1;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 20px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, rgba(79, 195, 247, 0.15), rgba(255, 87, 34, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%,
            100% {
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 30px rgba(79, 195, 247, 0.15);
            }
            50% {
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 45px rgba(255, 87, 34, 0.2);
            }
        }

        .logo-badge svg {
            width: 40px;
            height: 40px;
        }

        .site-title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #e3f2fd 0%, #4fc3f7 35%, #fff 50%, #ff9800 65%, #ff5722 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGradient 5s ease-in-out infinite;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        @keyframes titleGradient {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .subtitle .highlight {
            color: #ff9800;
            font-weight: 600;
            position: relative;
        }

        .subtitle .highlight-ice {
            color: #4fc3f7;
            font-weight: 600;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
            position: relative;
            z-index: 1;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2));
        }
        .divider::after {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.2), transparent);
        }

        .divider-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            animation: spinSlow 6s linear infinite;
        }

        @keyframes spinSlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .game-info {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-bottom: 32px;
        }

        .game-name {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .game-name .fire-text {
            background: linear-gradient(135deg, #ffcc80, #ff5722, #b71c1c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-name .ice-text {
            background: linear-gradient(135deg, #e3f2fd, #4fc3f7, #0288d1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-version {
            display: inline-block;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.06);
            padding: 5px 14px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition-smooth);
        }

        .game-version:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .game-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-top: 16px;
            max-width: 460px;
            margin-left: auto;
            margin-right: auto;
        }

        .download-section {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 18px 44px;
            border-radius: 60px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            border: none;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0288d1 0%, #4fc3f7 25%, #ff9800 75%, #ff5722 100%);
            background-size: 300% 300%;
            animation: btnGradient 4s ease-in-out infinite;
            box-shadow: 0 10px 35px rgba(79, 195, 247, 0.35), 0 10px 35px rgba(255, 87, 34, 0.25);
            transition: var(--transition-bounce);
            isolation: isolate;
            width: 100%;
            max-width: 420px;
            justify-content: center;
        }

        @keyframes btnGradient {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: btnShine 3s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes btnShine {
            0% {
                left: -100%;
            }
            50% {
                left: 50%;
            }
            100% {
                left: 100%;
            }
        }

        .download-btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 58px;
            background: rgba(0, 0, 0, 0.25);
            z-index: -1;
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .download-btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 18px 50px rgba(79, 195, 247, 0.5), 0 18px 50px rgba(255, 87, 34, 0.4);
            animation-duration: 2s;
        }

        .download-btn:hover::after {
            opacity: 1;
        }

        .download-btn:active {
            transform: translateY(0px) scale(0.97);
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.3), 0 6px 20px rgba(255, 87, 34, 0.25);
        }

        .download-btn .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounceDown 2s ease-in-out infinite;
        }

        @keyframes bounceDown {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(4px);
            }
        }

        .download-btn .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.3;
        }

        .download-btn .btn-text .btn-main {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .download-btn .btn-text .btn-sub {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 0.3px;
        }

        .download-note {
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .download-note .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4fc3f7;
            animation: dotPulse 2s ease-in-out infinite;
        }

        .download-note .dot:nth-child(2) {
            background: #ff9800;
            animation-delay: 0.5s;
        }

        .download-note .dot:nth-child(3) {
            background: #ff5722;
            animation-delay: 1s;
        }

        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 28px;
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .footer a {
            color: #4fc3f7;
            text-decoration: none;
            transition: var(--transition-smooth);
            position: relative;
        }

        .footer a:hover {
            color: #ff9800;
        }
        .footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: #ff9800;
            transition: var(--transition-smooth);
        }
        .footer a:hover::after {
            width: 100%;
        }

        @media (max-width: 600px) {
            .glass-card {
                padding: 32px 20px;
                border-radius: 22px;
            }

            .site-title {
                font-size: 1.9rem;
            }

            .game-name {
                font-size: 1.3rem;
            }

            .download-btn {
                padding: 16px 28px;
                font-size: 1rem;
            }

            .download-btn .btn-text .btn-main {
                font-size: 0.95rem;
            }

            .logo-badge {
                width: 58px;
                height: 58px;
                border-radius: 16px;
            }

            .logo-badge svg {
                width: 30px;
                height: 30px;
            }

            .game-desc {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 380px) {
            .glass-card {
                padding: 24px 14px;
                border-radius: 18px;
            }

            .site-title {
                font-size: 1.6rem;
            }

            .download-btn {
                padding: 14px 20px;
                border-radius: 50px;
                gap: 10px;
            }
        }

        .download-btn {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>

<script>
    (function() {
        const container = document.getElementById('particles');
        const particleCount = 35;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            const isIce = Math.random() > 0.5;
            particle.className = `particle ${isIce ? 'particle-ice' : 'particle-fire'}`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 12 - 6}s`;
            particle.style.animationDuration = `${6 + Math.random() * 6}s`;
            particle.style.transform = `scale(${0.5 + Math.random() * 1.2})`;
            container.appendChild(particle);
        }
    })();

    document.querySelector('.download-btn').addEventListener('click', function(e) {
        const btn = this;
        btn.style.transform = 'scale(0.95)';
        setTimeout(() => {
            btn.style.transform = '';
        }, 200);

        console.log('🚀 开始下载 ADOFAI...');
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.target.matches('input, textarea, select')) {
            const btn = document.querySelector('.download-btn');
            if (btn) {
                btn.click();
            }
        }
    });

    if ('ontouchstart' in window) {
        document.querySelector('.download-btn').addEventListener('touchstart', function() {
            this.style.transform = 'scale(0.96)';
        }, { passive: true });
        document.querySelector('.download-btn').addEventListener('touchend', function() {
            this.style.transform = '';
        }, { passive: true });
    }
</script>
</body>
</html>
